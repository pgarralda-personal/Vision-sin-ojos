<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visión sin ojos</title>
<style>
:root {
  --bg:#f6f5f2; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e0db;
  --accent:#2f5d8a; --accent-text:#fff; --stop:#a33a2e; --ok:#2e7d4f; --soft:#eef2f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#161618; --card:#222225; --text:#ececee; --muted:#9a9aa0; --line:#36363a;
    --accent:#6f9fd0; --accent-text:#0d1620; --stop:#e07a6c; --ok:#6cc08f; --soft:#2a2e34; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:24px; margin:0 0 4px; line-height:1.25; }
h2 { font-size:17px; margin:0 0 10px; }
h3 { font-size:12px; margin:16px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
h3:first-of-type { margin-top:4px; }
.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:15px; margin-top:12px; }
.row label { flex:1; }
select { font:inherit; font-size:15px; padding:6px 8px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); }
input[type=checkbox] { accent-color:var(--accent); width:20px; height:20px; margin:0; flex:0 0 auto; }
.hint { font-size:13px; color:var(--muted); margin:4px 0 0; }
button { font:inherit; border:0; border-radius:10px; cursor:pointer; color:inherit; }
.go { width:100%; padding:16px; font-size:19px; font-weight:600; background:var(--accent); color:var(--accent-text); margin-top:18px; }
.sec { padding:8px 12px; font-size:14px; background:var(--soft); color:var(--text); }
.danger { color:var(--stop); }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
ol, ul { padding-left:20px; margin:8px 0 0; }
li { margin-bottom:6px; font-size:15px; }
kbd { font:inherit; font-size:12px; border:1px solid var(--line); border-radius:4px; padding:0 5px; background:var(--soft); }
table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
td.num, th.num { text-align:right; white-space:nowrap; }
.tablewrap { overflow-x:auto; }
.empty { color:var(--muted); font-size:14px; }
.big { font-size:40px; font-weight:700; line-height:1.1; margin:6px 0; font-variant-numeric:tabular-nums; }
.verdict { padding:12px 14px; border-radius:10px; background:var(--soft); margin-top:12px; font-size:15px; }
.pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--soft); color:var(--muted); }
[hidden] { display:none !important; }

/* Level picker */
.levels { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
.lvl { text-align:left; padding:8px 10px; background:var(--soft); border:2px solid transparent; display:flex; gap:10px; align-items:center; }
.lvl.on { border-color:var(--accent); background:var(--card); }
.lvl .n { flex:0 0 26px; height:26px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.lvl.on .n { background:var(--accent); color:var(--accent-text); }
.lvl .t { font-size:14px; font-weight:600; line-height:1.25; }
.lvl .s { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.swatches { display:flex; gap:3px; margin-top:3px; }
.swatches i { width:12px; height:12px; border-radius:3px; border:1px solid var(--line); display:inline-block; }
.lvlinfo { margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--soft); font-size:14px; }
.lvlinfo b { font-size:15px; }

.zones { display:grid; width:140px; aspect-ratio:3/4; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:11px; margin-top:10px; }
.zones div { display:flex; align-items:center; justify-content:center; text-align:center; border:1px dashed var(--line); padding:2px; color:var(--muted); line-height:1.2; }
.zones b { color:var(--text); display:block; font-size:15px; }

input[type=text] { font:inherit; font-size:16px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); flex:1; min-width:0; }
.lvl.locked { opacity:.45; cursor:not-allowed; }
.lvl .done { color:var(--ok); font-weight:600; }
.verdict.pass { background:color-mix(in srgb, var(--ok) 16%, var(--card)); }
.verdict.pass b { color:var(--ok); }

/* Progress chart */
.evo svg { width:100%; height:auto; display:block; margin-top:10px; overflow:visible; }
.evo .grid { stroke:var(--line); stroke-width:1; }
.evo .ref { stroke:var(--muted); stroke-width:1.5; stroke-dasharray:5 4; }
.evo .goal { stroke:var(--ok); stroke-width:1.5; stroke-dasharray:2 4; }
.evo .axis { fill:var(--muted); font-size:11px; }
.evo .lab { fill:var(--muted); font-size:11px; font-weight:600; }
.evo .series { stroke:var(--accent); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
.evo .pt { fill:var(--accent); stroke:var(--card); stroke-width:2; }
.evo .pt.ok { fill:var(--ok); }
.evo .mark { fill:var(--ok); font-size:12px; font-weight:700; }
.evo g.p:hover .pt { r:7; }
.evo .hitbox { fill:transparent; cursor:default; }
.trend { font-size:14px; margin-top:8px; }

/* Session stage: full screen, no UI the eyes could rely on */
#stage { position:fixed; inset:0; background:#000; z-index:10; touch-action:none; user-select:none;
  -webkit-user-select:none; -webkit-touch-callout:none; cursor:none; }
#stage svg { position:absolute; inset:0; width:100%; height:100%; }
#stage .msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#888; text-align:center; padding:24px; font-size:18px; cursor:default; }
#stage .msg small { font-size:14px; margin-top:10px; color:#666; max-width:420px; }
.top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.top select { font-size:14px; padding:4px 6px; flex:0 0 auto; }
</style>
</head>
<body>
<main id="welcome" hidden>
  <div class="top"><h1 data-i="app"></h1><select class="langsel" aria-label="Idioma / Language"></select></div>
  <p class="sub" data-i="tagline"></p>
  <section class="card">
    <h2 data-i="askName"></h2>
    <p class="hint" style="margin-bottom:12px" data-i="nameHint"></p>
    <div class="row" style="margin-top:0"><input type="text" id="w-name" maxlength="40" data-i-ph="namePh" autocomplete="off">
      <button class="sec" id="w-go" style="padding:10px 16px" data-i="start"></button></div>
  </section>
</main>

<main id="home" hidden>
  <div class="top"><h1 data-i="app"></h1><select class="langsel" aria-label="Idioma / Language"></select></div>
  <p class="sub"><span data-i="tagline"></span> <span data-i="startHint"></span></p>

  <section class="card">
    <div class="row" style="margin-top:0"><label for="p-sel"><b data-i="person"></b></label><select id="p-sel"></select></div>
    <div class="btnrow">
      <button class="sec" id="p-new" data-i="pNew"></button>
      <button class="sec" id="p-ren" data-i="pRen"></button>
      <button class="sec danger" id="p-del" data-i="pDel"></button>
    </div>
    <p class="hint" data-i="pHint"></p>
  </section>

  <section class="card">
    <h2 data-i="level"></h2>
    <div id="levels"></div>
    <div class="lvlinfo" id="lvlinfo"></div>
  </section>

  <section class="card">
    <h2 data-i="session"></h2>
    <div class="row" style="margin-top:0"><label for="s-n" data-i="trialsLabel"></label>
      <select id="s-n">
        <option>10</option><option>20</option><option>25</option><option>50</option><option>100</option>
      </select></div>
    <div class="row"><label for="s-mode" data-i="screen"></label>
      <select id="s-mode">
        <option value="show" data-i="modeShow"></option>
        <option value="control" data-i="modeControl"></option>
      </select></div>
    <p class="hint" data-i="controlHint"></p>
    <div class="row"><label for="s-gate" data-i="gate"></label><input type="checkbox" id="s-gate" checked></div>
    <div class="row" id="row-bar"><label for="s-bar" data-i="bar"></label>
      <select id="s-bar">
        <option value="0.05" data-i="bar05"></option>
        <option value="0.01" data-i="bar01" selected></option>
        <option value="0.001" data-i="bar001"></option>
      </select></div>
    <p class="hint" id="hint-bar" data-i="barHint"></p>
    <div class="row"><label for="s-fb" data-i="fb"></label><input type="checkbox" id="s-fb" checked></div>
    <div class="row" id="row-eq"><label for="s-eq" data-i="eq"></label><input type="checkbox" id="s-eq" checked></div>
    <p class="hint" id="hint-eq" data-i="eqHint"></p>
    <div class="row"><label for="s-voice" data-i="voice"></label><input type="checkbox" id="s-voice"></div>
    <p class="hint" id="hint-voice"></p>
    <button class="go" id="start" data-i="start"></button>
  </section>

  <section class="card">
    <h2 data-i="howTitle"></h2>
    <ul>
      <li id="how-keys"></li>
      <li data-i="howTouch"></li>
      <li data-i="howVoice"></li>
    </ul>
    <div class="zones" id="zones"></div>
    <p class="hint" data-i="howHint"></p>
  </section>

  <section class="card">
    <h2 data-i="tipsTitle"></h2>
    <ol>
      <li data-i="tip1"></li>
      <li data-i="tip2"></li>
      <li data-i="tip3"></li>
    </ol>
  </section>

  <section class="card evo">
    <h2 data-i="evoTitle"></h2>
    <div class="row" style="margin-top:0"><label for="e-lvl" data-i="level"></label><select id="e-lvl"></select></div>
    <div id="evo"></div>
  </section>

  <section class="card">
    <h2 data-i="totalsTitle"></h2>
    <div id="totals"></div>
  </section>

  <section class="card">
    <h2 data-i="histTitle"></h2>
    <div id="history"></div>
    <div class="btnrow">
      <button class="sec" id="export" data-i="export"></button>
      <button class="sec danger" id="reset" data-i="reset"></button>
    </div>
  </section>
</main>

<main id="result" hidden>
  <h1 data-i="resTitle"></h1>
  <p class="sub" id="r-sub"></p>
  <section class="card">
    <div class="big" id="r-big"></div>
    <div id="r-detail"></div>
    <div id="r-dims"></div>
    <div class="verdict" id="r-verdict"></div>
    <div class="verdict" id="r-gate" hidden></div>
  </section>
  <section class="card">
    <h2 data-i="trials"></h2>
    <div class="tablewrap"><table id="r-trials"></table></div>
  </section>
  <div class="btnrow">
    <button class="sec" id="again" style="flex:1;padding:14px" data-i="again"></button>
    <button class="sec" id="next" style="flex:1;padding:14px"></button>
  </div>
  <button class="go" id="back" data-i="back"></button>
</main>

<div id="stage" hidden></div>

<script>
'use strict';
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// File name of a voice clip; must match slug() in tools/make_audio.py
const slug = s => norm(String(s)).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
const $ = id => document.getElementById(id);

// ───────── Language ─────────
const I18N = JSON.parse($('i18n').textContent);
const LANGS = Object.keys(I18N);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// A language chosen in the app wins; otherwise the browser's language; otherwise English
function browserLang() {
  for (const l of navigator.languages || [navigator.language || '']) {
    const c = String(l).toLowerCase().split('-')[0];
    if (I18N[c]) return c;
  }
  return 'en';
}
let lang = LS.get('vso.lang', null);
if (!I18N[lang]) lang = browserLang();
let T = I18N[lang];
// t('key', {var}) → text with {var} filled in. Texts may contain trusted HTML.
const t = (k, v = {}) => String(T.ui[k] ?? I18N.es.ui[k] ?? k).replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m);

// ───────── Building blocks ─────────
// eq = colors with matched relative luminance (~0.21, same as the gray shown between trials)
const COLOR_HEX = {
  rojo:     { vivid:'#ff0000', eq:'#ff0000' },
  azul:     { vivid:'#0033ff', eq:'#6b6bff' },
  verde:    { vivid:'#00c000', eq:'#009600' },
  amarillo: { vivid:'#ffe000', eq:'#848400' },
  naranja:  { vivid:'#ff8000', eq:'#c86400' },
  morado:   { vivid:'#9000ff', eq:'#ad4dff' }
};
const GRAY_EQ = '#7f7f7f';

// Every item: id (same in every language, so results stay comparable), name (shown), say (spoken),
// match (list of word groups; all groups must be heard), plus what to draw and dims for combinations.
const W = id => (T.items[id].w || []).map(norm);
const N = id => T.items[id].n, SAY = id => T.items[id].s || T.items[id].n;
const colorItem = c => ({ id:c, name:N(c), say:SAY(c), match:[W(c)], bg:c });
const bwItem = (id, hex) => ({ id, name:N(id), say:SAY(id), match:[W(id)], bgHex:hex });
const shapeItem = (s, c) => { const id = c ? `${s}-${c}` : s;
  return { id, name:N(id), say:SAY(id), match: c ? [W(s), W(c)] : [W(s)], shape:s, fill:c || null, dims: c ? { forma:s, color:c } : null }; };
const letterItem = (l, c) => { const id = c ? `${l}-${c}` : l;
  return { id, name:N(id), say:SAY(id), match: c ? [W(l), W(c)] : [W(l)], letter:l, fill:c || null, key: c ? null : l.toLowerCase(), dims: c ? { letra:l, color:c } : null }; };
const wordItem = w => ({ id:w, name:w, say:T.words[w].s, match:[T.words[w].w.map(norm)], text:w });
const product = (a, b, f) => a.flatMap(x => b.map(y => f(x, y)));
const words = n => Object.keys(T.words).slice(0, n).map(wordItem);

const LEVEL_SPEC = [
  ['bn', 'colors', () => [bwItem('blanco', '#ffffff'), bwItem('negro', '#000000')]],
  ['c2', 'colors', () => ['rojo','azul'].map(colorItem)],
  ['c3', 'colors', () => ['rojo','azul','verde'].map(colorItem)],
  ['c4', 'colors', () => ['rojo','azul','verde','amarillo'].map(colorItem)],
  ['c6', 'colors', () => ['rojo','azul','verde','amarillo','naranja','morado'].map(colorItem)],
  ['z2', 'zener', () => ['circulo','cruz'].map(s => shapeItem(s))],
  ['z3', 'zener', () => ['circulo','cruz','ondas'].map(s => shapeItem(s))],
  ['z5', 'zener', () => ['circulo','cruz','ondas','cuadrado','estrella'].map(s => shapeItem(s))],
  ['zc4', 'zc', () => product(['circulo','cruz'], ['rojo','azul'], shapeItem)],
  ['zc6', 'zc', () => product(['circulo','cruz','ondas'], ['rojo','azul'], shapeItem)],
  ['l2', 'letters', () => ['O','X'].map(l => letterItem(l))],
  ['l4', 'letters', () => ['A','O','T','X'].map(l => letterItem(l))],
  ['lc4', 'lc', () => product(['O','X'], ['rojo','azul'], letterItem)],

  ['p4', 'words', () => words(4)]

let LEVELS = [], LEVEL = {};
function buildLevels() {

    const L = { id, num: i + 1, group: T.groups[group], name: T.levels[id].name, note: T.levels[id].note || '', items: items() };
    L.k = L.items.length;
    L.hasColor = L.items.some(it => it.bg || it.fill);
    L.dimNames = L.items[0].dims ? Object.keys(L.items[0].dims) : [];
    return L;
  });

buildLevels();
// Touch zones: columns × rows, numbered in reading order. With 5 options the last zone takes the whole bottom row.
const LAYOUT = { 2:[2,1], 3:[3,1], 4:[2,2], 5:[2,3], 6:[2,3] };
const sayOf = it => it.say || it.name;

// ───────── Storage (never required for the app to work) ─────────
// Each person (profile) keeps its own trials, sessions and current level under vso.p.<id>.*
let profiles = LS.get('vso.profiles', []);
if (!Array.isArray(profiles)) profiles = [];
profiles = profiles.filter(p => p && typeof p.id === 'string' && typeof p.name === 'string');
let profile = null, trials = [], sessions = [], levelId = 'bn';
const pkey = (id, k) => `vso.p.${id}.${k}`;
const saveProfiles = () => LS.set('vso.profiles', profiles);
const saveAll = () => { if (!profile) return; LS.set(pkey(profile.id, 'trials'), trials); LS.set(pkey(profile.id, 'sessions'), sessions); };
function loadProfile(id) {
  profile = profiles.find(p => p.id === id) || profiles[0] || null;
  trials = []; sessions = []; levelId = 'bn';
  if (!profile) return;
  LS.set('vso.current', profile.id);
  const tr = LS.get(pkey(profile.id, 'trials'), []), s = LS.get(pkey(profile.id, 'sessions'), []);
  trials = Array.isArray(tr) ? tr.filter(x => x && LEVEL[x.level]) : [];
  sessions = Array.isArray(s) ? s.filter(x => x && LEVEL[x.level]) : [];
  if (LEVEL[profile.level]) levelId = profile.level;
}
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 40);
function createProfile(name) {
  const existing = profiles.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) return loadProfile(existing.id);
  const p = { id: Date.now().toString(36) + randInt(1e6).toString(36), name, created: new Date().toISOString(), level: 'bn' };
  profiles.push(p); saveProfiles();
  // The first person inherits results saved before profiles existed
  if (profiles.length === 1) {
    const ot = LS.get('vso.trials', null), os = LS.get('vso.sessions', null);
    if (Array.isArray(ot) && ot.length) { LS.set(pkey(p.id, 'trials'), ot); LS.set(pkey(p.id, 'sessions'), Array.isArray(os) ? os : []); }
    try { localStorage.removeItem('vso.trials'); localStorage.removeItem('vso.sessions'); } catch {}
  }
  loadProfile(p.id);
}

// ───────── Settings ─────────
const S = { n:$('s-n'), mode:$('s-mode'), fb:$('s-fb'), eq:$('s-eq'), voice:$('s-voice'), gate:$('s-gate'), bar:$('s-bar') };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIN_PASS = 20; // shortest session that can pass a level
const BAR_N = { '0.05':20, '0.01':100, '0.001':1000 };
(function loadSettings() {
  const s = LS.get('vso.settings', {});
  if (s && typeof s === 'object') {
    if (typeof s.gate === 'boolean') S.gate.checked = s.gate;
    if (['0.05','0.01','0.001'].includes(String(s.bar))) S.bar.value = String(s.bar);
    if (['10','20','25','50','100'].includes(String(s.n))) S.n.value = String(s.n);
    if (s.mode === 'show' || s.mode === 'control') S.mode.value = s.mode;
    if (typeof s.fb === 'boolean') S.fb.checked = s.fb;
    if (typeof s.eq === 'boolean') S.eq.checked = s.eq;
    if (typeof s.voice === 'boolean') S.voice.checked = s.voice && !!SR;
  }
  if (!SR) { S.voice.checked = false; S.voice.disabled = true; }
})();
function settings() {
  return { level:levelId, n:+S.n.value, mode:S.mode.value, fb:S.fb.checked, eq:S.eq.checked, voice:S.voice.checked && !!SR,
    gate:S.gate.checked, bar:+S.bar.value };
}
// Highest level number this person may play: a level opens once every level before it has a passed session
function unlockedNum() {
  let u = 1;
  for (const L of LEVELS) { if (sessions.some(s => s.level === L.id && s.passed)) u = L.num + 1; else break; }
  return Math.min(u, LEVELS.length);
}
const isLocked = L => S.gate.checked && L.num > unlockedNum();
const isPassed = L => sessions.some(s => s.level === L.id && s.passed);
function onSettings() {
  // Short sessions can't pass a level, so they're not offered while levels are gated
  [...S.n.options].forEach(o => { o.disabled = S.gate.checked && +o.value < MIN_PASS; });
  if (S.gate.checked && +S.n.value < MIN_PASS) S.n.value = String(MIN_PASS);
  if (isLocked(LEVEL[levelId])) levelId = LEVELS[unlockedNum() - 1].id;
  if (profile && profile.level !== levelId) { profile.level = levelId; saveProfiles(); }
  $('row-bar').hidden = $('hint-bar').hidden = !S.gate.checked;
  const s = settings(), L = LEVEL[s.level];
  LS.set('vso.settings', { n:s.n, mode:s.mode, fb:s.fb, eq:s.eq, voice:S.voice.checked, gate:s.gate, bar:String(s.bar) });
  $('row-eq').hidden = $('hint-eq').hidden = !L.hasColor || L.id === 'bn';
  const keys = L.items.filter(it => it.key).map(it => `<kbd>${it.key.toUpperCase()}</kbd>`);
  $('how-keys').innerHTML = t('howKeys', { k: L.k, letters: keys.length ? t('howLetters', { keys: keys.join(' ') }) : '' });
  drawZones(L);
  renderLevels();
  renderEvo();
}
Object.values(S).forEach(el => el.addEventListener('change', onSettings));
function setLevel(id) { if (!LEVEL[id] || isLocked(LEVEL[id])) return; levelId = id; onSettings(); }

function drawZones(L) {
  const [c, r] = LAYOUT[L.k];
  const z = $('zones');
  z.style.gridTemplateColumns = `repeat(${c},1fr)`; z.style.gridTemplateRows = `repeat(${r},1fr)`;
  const spare = c * r - L.k; // the last zone stretches over unused cells
  z.innerHTML = L.items.map((it, i) => `<div${i === L.k - 1 && spare ? ` style="grid-column:span ${spare + 1}"` : ''}><span><b>${i+1}</b>${esc(it.name)}</span></div>`).join('');
}

// Static texts of the page, in the current language
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('app');
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t(el.dataset.i); });
  document.querySelectorAll('[data-i-ph]').forEach(el => { el.placeholder = t(el.dataset.iPh); });
  document.querySelectorAll('.langsel').forEach(sel => {
    sel.innerHTML = LANGS.map(l => `<option value="${l}"${l === lang ? ' selected' : ''}>${esc(I18N[l].name)}</option>`).join('');
  });
  $('hint-voice').textContent = SR ? t('voiceHint') : t('voiceNo');
}
function setLang(l) {
  if (!I18N[l] || run) return;
  lang = l; T = I18N[l]; LS.set('vso.lang', l);
  pickVoice(); clipsOff = false;
  buildLevels(); applyLang(); showApp();
}
document.querySelectorAll('.langsel').forEach(sel => sel.addEventListener('change', e => setLang(e.target.value)));

// ───────── Randomness (crypto, unbiased) ─────────
function randInt(k) {
  const a = new Uint32Array(1), lim = Math.floor(0x100000000 / k) * k;
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % k;
}

// ───────── Sound & speech ─────────
let actx = null;
function tone(freq, ms, vol = 0.15) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms / 1000);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000);
}
// Speech is a list of recorded clips (audio/<lang>/<key>.mp3, made by tools/make_audio.py) played one after another.
// If a clip can't be played (e.g. the audio folder is missing), the rest is read by the system voice.
const clip = (key, text, gap = 250) => ({ key, text, gap });
const numClip = (n, gap = 150) => clip('n' + n, String(n), gap);
const itemClip = (it, gap = 350) => clip('i_' + slug(it.id), sayOf(it), gap);
const sClip = (k, gap = 250) => clip('s_' + k, T.speech[k], gap);
const levelClip = L => clip('l_' + L.id, T.levelSay.replace('{n}', L.num).replace('{name}', L.name.replace('×', T.times)), 300);
const clipUrl = key => `audio/${lang}/${key}.mp3`;
const player = new Audio();
let speakId = 0, clipsOff = false, stopClip = null, sysVoice = null;

function playClip(c) {
  return new Promise(res => {
    let done = false, timer = 0;
    const fin = ok => { if (done) return; done = true; clearTimeout(timer); player.onended = player.onerror = null; stopClip = null; res(ok); };
    stopClip = () => fin(true);
    player.onended = () => fin(true);
    player.onerror = () => fin(false);
    timer = setTimeout(() => fin(false), 10000);
    player.src = clipUrl(c.key);
    const p = player.play(); if (p) p.catch(() => fin(false));
  });
}
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(), loc = T.locale.toLowerCase().replace('_', '-');
  sysVoice = vs.find(v => v.lang.toLowerCase().replace('_', '-') === loc) || vs.find(v => v.lang.toLowerCase().startsWith(lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function sayText(text, id) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || id !== speakId) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = T.locale; if (sysVoice) u.voice = sysVoice; u.rate = 1.05;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin;

  });
}
function hush() {
  speakId++;
  try { player.pause(); } catch {}
  if (stopClip) stopClip();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
async function say(parts) {
  hush();
  const id = speakId;
  parts = parts.filter(c => c && c.text);
  for (let i = 0; i < parts.length; i++) {
    if (id !== speakId) return;
    if (!clipsOff) {
      if (await playClip(parts[i])) { if (id === speakId && i < parts.length - 1) await wait(parts[i].gap); continue; }
      if (id !== speakId) return;
      clipsOff = true;
    }
    return sayText(parts.slice(i).map(c => c.text).join(' '), id);
  }
}
// Warm the browser cache so the first clips of a session play without delay
function preload(parts) {
  if (clipsOff || !/^https?:/.test(location.protocol)) return;
  for (const c of parts) fetch(clipUrl(c.key)).catch(() => {});
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ───────── Shapes with equal area (so total light doesn't give them away) ─────────
function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const [x1,y1] = p[i], [x2,y2] = p[(i+1)%p.length]; a += x1*y2 - x2*y1; } return Math.abs(a) / 2; }
function regular(n, r, rot = -Math.PI/2, inner = null) {
  const pts = [], m = inner ? n * 2 : n;
  for (let i = 0; i < m; i++) { const rr = inner && i % 2 ? inner * r : r, a = rot + i * 2 * Math.PI / m; pts.push([rr*Math.cos(a), rr*Math.sin(a)]); }
  return pts;
}
const SHAPE_AREA = 0.8; // in a 2×2 viewBox
const f4 = v => v.toFixed(4);
// Each entry is fill => SVG markup, scaled so every symbol covers the same area
const SHAPES = (() => {
  const w = 1; // cross arm thickness before scaling
  const cross = [[-w/2,-1.5*w],[w/2,-1.5*w],[w/2,-w/2],[1.5*w,-w/2],[1.5*w,w/2],[w/2,w/2],[w/2,1.5*w],[-w/2,1.5*w],[-w/2,w/2],[-1.5*w,w/2],[-1.5*w,-w/2],[-w/2,-w/2]];
  const polys = { circulo: regular(128, 1), cuadrado: regular(4, 1, Math.PI/4), estrella: regular(5, 1, -Math.PI/2, 0.45), cruz: cross };
  const out = {};
  for (const [k, p] of Object.entries(polys)) {
    const s = Math.sqrt(SHAPE_AREA / polyArea(p));
    const pts = p.map(([x, y]) => `${f4(x*s)},${f4(y*s)}`).join(' ');
    out[k] = fill => `<polygon points="${pts}" fill="${fill}"/>`;
  }
  // Three wavy lines; stroke width chosen so the lines cover the same area as the other symbols
  const Wd = 1.5, amp = 0.1, Np = 120, gap = 0.42, line = [];
  for (let i = 0; i <= Np; i++) line.push([-Wd/2 + Wd*i/Np, amp * Math.sin(4 * Math.PI * i / Np)]);
  let len = 0; for (let i = 1; i <= Np; i++) len += Math.hypot(line[i][0]-line[i-1][0], line[i][1]-line[i-1][1]);
  const sw = SHAPE_AREA / (3 * len);
  const d = [-gap, 0, gap].map(dy => 'M' + line.map(([x, y]) => `${f4(x)},${f4(y + dy)}`).join(' L')).join(' ');
  out.ondas = fill => `<path d="${d}" fill="none" stroke="${fill}" stroke-width="${f4(sw)}" stroke-linecap="butt" stroke-linejoin="round"/>`;
  return out;
})();

// ───────── Drawing ─────────
const stage = $('stage');
const colorHex = (c, eq) => COLOR_HEX[c][eq ? 'eq' : 'vivid'];
function neutralBg(L, eq) {
  if (L.id === 'bn') return GRAY_EQ;
  return L.items[0].bg && eq ? GRAY_EQ : '#000';
}
function drawItem(it, eq) {
  stage.innerHTML = '';
  if (it.bgHex) { stage.style.background = it.bgHex; return; }
  if (it.bg) { stage.style.background = colorHex(it.bg, eq); return; }
  stage.style.background = '#000';
  const fill = it.fill ? colorHex(it.fill, eq) : '#fff';
  const font = `font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif"`;
  const inner = it.shape ? SHAPES[it.shape](fill)
    : it.letter ? `<text x="0" y="0" fill="${fill}" font-size="1.7" ${font}>${it.letter}</text>`
    : `<text x="0" y="0" fill="${fill}" font-size="0.8" ${font}>${esc(it.text)}</text>`;
  stage.innerHTML = `<svg viewBox="-1 -1 2 2" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}

// ───────── Session runner ─────────
let run = null;
function showNeutral() { stage.innerHTML = ''; stage.style.background = neutralBg(run.L, run.s.eq); }
function showTarget(idx) {
  if (run.s.mode === 'control') return showNeutral();
  drawItem(run.L.items[idx], run.s.eq);
}
const optionsText = L => t('optionsText', { list: L.items.map((it, i) => `${i+1}, ${it.name}`).join('. ') });
const optionsSpeech = L => [sClip('options', 300), ...L.items.flatMap((it, i) => [numClip(i + 1), itemClip(it)])];
const endSession = () => finish(true); // the result screen says "Session ended" first

async function startSession() {
  const s = settings(), L = LEVEL[s.level];
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
  const sess = { id: Date.now().toString(36) + randInt(1e6).toString(36), start: new Date().toISOString(),
    level: L.id, k: L.k, n: s.n, mode: s.mode, eq: L.hasColor ? s.eq : null, done: 0, finished: false, lang };
  sessions.push(sess); saveAll();
  run = { s, L, sess, i: 0, phase: 'ready', target: -1, shownAt: 0, rec: null, wakeLock: null, list: [] };
  document.body.style.overflow = 'hidden';
  $('home').hidden = true; $('result').hidden = true; stage.hidden = false;
  stage.style.background = '#000';
  stage.innerHTML = `<div class="msg">${esc(t('levelN', { n: L.num, name: L.name }))}<br><br>${t('stageReady')}
    <small>${esc(optionsText(L))} ${esc(t('stageEnd'))}</small></div>`;
  let fs = null;
  try { fs = stage.requestFullscreen ? stage.requestFullscreen() : stage.webkitRequestFullscreen?.(); } catch {}
  // Started inside the click so phones allow the audio

async function begin() {
  if (!run || run.phase !== 'ready') return;
  run.phase = 'intro';
  showNeutral();
  await say([...optionsSpeech(run.L), sClip('begin')]);
  await wait(600);
  if (run && run.phase === 'intro') nextTrial();
}

function nextTrial() {
  if (!run) return;
  if (run.i >= run.s.n) return finish(false);
  run.target = randInt(run.L.k);
  showTarget(run.target);
  tone(660, 120);
  run.shownAt = performance.now();
  run.phase = 'await';
  listen();
}

function partialSpeech(L, tIt, aIt) {
  if (!tIt.dims) return null;
  const ok = L.dimNames.filter(d => tIt.dims[d] === aIt.dims[d]);
  return ok.length ? sClip('part_' + ok[0]) : null;
}

async function answer(idx, via) {
  if (!run || run.phase !== 'await' || idx < 0 || idx >= run.L.k) return;
  if (performance.now() - run.shownAt < 250) return; // ignore taps carried over from the last trial
  run.phase = 'feedback';
  stopListening();
  const L = run.L, rt = Math.round(performance.now() - run.shownAt);
  const tIt = L.items[run.target], aIt = L.items[idx], hit = idx === run.target;
  const tr = { sid: run.sess.id, t: new Date().toISOString(), level: L.id, k: L.k, mode: run.s.mode,
    target: tIt.id, answer: aIt.id, hit, via, rt };
  trials.push(tr); run.list.push(tr);
  run.i++; run.sess.done = run.i; saveAll();
  showNeutral();
  if (run.s.fb) {
    tone(hit ? 880 : 300, 160);
    await say(hit ? [sClip('yes', 120), itemClip(tIt)] : [sClip('no', 120), itemClip(tIt), partialSpeech(L, tIt, aIt)]);
  } else {
    tone(520, 60, 0.08);
    await wait(400);
  }
  await wait(700);

// Voice answers: every word group of an item must be heard (e.g. a shape word AND a color word)
function matchSpeech(heard, L) {
  for (let i = 0; i < L.k; i++) if (L.items[i].match.every(g => g.some(w => heard.includes(w)))) return i;
  for (let i = 0; i < L.k; i++) if (T.numbers[i].some(w => heard.includes(norm(w)))) return i;
  return -1;
}

  rec.lang = T.locale; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
  rec.onresult = e => {
    if (!run) return;

      for (let a = 0; a < e.results[r].length; a++) {
        const i = matchSpeech(norm(e.results[r][a].transcript).split(/[^\p{L}\p{N}]+/u), run.L);

}

async function finish(early) {
  if (!run) return;
  const r = run; run = null;
  stopListening();

  r.sess.finished = !early; r.sess.done = r.list.length;
  // Only a complete, non-control session of 20+ trials can pass a level

    r.sess.bar = r.s.bar;
    r.sess.passed = groupStats(r.list).p <= r.s.bar;
  }
  r.sess.unlocked = unlockedNum() > before;

let pressAt = 0, pressTimer = null;

// ───────── Progress chart: hit rate per session for one level ─────────

  if (pts.length > 1) g += `<polyline class="series" points="${pts.map((p, i) => `${x(i)},${y(p.rate)}`).join(' ')}"/>`;
  pts.forEach((p, i) => {
    const tip = `${t('evoTip', { i: i + 1, date: fmtDate(p.s.start) })}\n${t('xOfY', { a: p.st.hits, b: p.st.n })} (${pct(p.rate)})${p.s.passed ? t('evoTipPassed') : ''}${p.s.finished ? '' : t('evoTipIncomplete')}`;

}
function showApp() {
  $('welcome').hidden = !!profile; $('home').hidden = !profile; $('result').hidden = true;
  if (!profile) { setTimeout(() => $('w-name').focus(), 50); return; }
  renderProfiles(); onSettings(); renderHome(); window.scrollTo(0, 0);
}
function welcomeGo() {
  const name = cleanName($('w-name').value);
  if (!name) { $('w-name').focus(); return; }
  createProfile(name); $('w-name').value = ''; showApp();
}
$('w-go').addEventListener('click', welcomeGo);
$('w-name').addEventListener('keydown', e => { if (e.key === 'Enter') welcomeGo(); });
$('p-sel').addEventListener('change', e => { loadProfile(e.target.value); evoLevel = null; showApp(); });
$('p-new').addEventListener('click', () => {
  const name = cleanName(prompt(t('askOther')));
  if (name) { createProfile(name); evoLevel = null; showApp(); }
});
$('p-ren').addEventListener('click', () => {
  const name = cleanName(prompt(t('askRename'), profile.name));
  if (name) { profile.name = name; saveProfiles(); renderProfiles(); }
});
$('p-del').addEventListener('click', () => {
  if (!confirm(t('confirmDel', { name: profile.name }))) return;
  try { localStorage.removeItem(pkey(profile.id, 'trials')); localStorage.removeItem(pkey(profile.id, 'sessions')); } catch {}
  profiles = profiles.filter(p => p !== profile); saveProfiles();
  loadProfile(profiles[0]?.id); evoLevel = null; showApp();
});

function goHome() { hush(); $('result').hidden = true; $('home').hidden = false; renderHome(); window.scrollTo(0, 0); }
$('start').addEventListener('click', startSession);
$('back').addEventListener('click', goHome);
$('again').addEventListener('click', () => { hush(); setLevel($('result').dataset.level); startSession(); });
$('next').addEventListener('click', () => { const L = LEVELS[LEVEL[$('result').dataset.level].num]; if (L) setLevel(L.id); goHome(); });
$('export').addEventListener('click', () => {
  const head = 'persona,sesion,fecha,nivel,opciones,pantalla,objetivo,respuesta,acierto,via,tiempo_ms';
  const who = '"' + profile.name.replace(/"/g, '""') + '"';
  const lines = trials.map(x => [who, x.sid, x.t, LEVEL[x.level].num, x.k, x.mode, x.target, x.answer, x.hit ? 1 : 0, x.via, x.rt].join(','));
  const blob = new Blob([[head, ...lines].join('\n')], { type:'text/csv' });
  const name = norm(profile.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'persona';
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vision-sin-ojos-${name}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('reset').addEventListener('click', () => {
  if (!confirm(t('confirmReset', { name: profile.name }))) return;
  trials = []; sessions = []; saveAll(); onSettings(); renderHome();
});

applyLang();
loadProfile(LS.get('vso.current', null));
showApp();
</script>
</body>
</html>
